# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/getting-started/

# theme = "blowfish" # No descomentar: el tema se importa vía Hugo Modules (config/_default/module.toml)
baseURL = "https://JOG-phis.github.io/fractalis/"
defaultContentLanguage = "es"

# pluralizeListTitles = "true" # hugo function useful for non-english languages, find out more in  https://gohugo.io/getting-started/configuration/#pluralizelisttitles

enableRobotsTXT = true
summaryLength = 0

buildDrafts = false
buildFuture = false

enableEmoji = true

# Los títulos automáticos de etiquetas y listados se dejan como se escriben (en español no se pone Mayúscula En Cada Palabra)
capitalizeListTitles = false

# googleAnalytics = "G-XXXXXXXXX"

[pagination]
  pagerSize = 100

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"
  clase = "clase"     # tipo de actividad (ejercicios, breakouts...): páginas /clase/<tipo>/ con todas las de ese tipo, de todos los cursos
  materia = "materia"           # física, química, computación y robótica, docencia (vocabulario: data/vocabulario.yaml)
  herramienta = "herramienta"   # PhET, Arduino, impresión 3D... (solo si la actividad usa alguna)
  metodologia = "metodologia"   # gamificación, ABP... (solo si es parte esencial de la actividad)

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false

    [[related.indices]]
        name = "tags"
        weight = 100

    [[related.indices]]
        name = "categories"
        weight = 100

    [[related.indices]]
        name = "materia"
        weight = 60

    [[related.indices]]
        name = "series"
        weight = 50

    [[related.indices]]
        name = "authors"
        weight = 20

    [[related.indices]]
        name = "date"
        weight = 10

    [[related.indices]]
      applyFilter = false
      name = 'fragmentrefs'
      type = 'fragments'
      weight = 10
