name: Deploy Fractalis to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'   # la misma versión de Go que declara go.mod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Versión fijada: la más alta que Blowfish v2.105.0 declara compatible (min 0.158.0, max 0.164.0).
          # Al actualizar Blowfish (go.mod), revisar su config.toml [module.hugoVersion] y subir esta versión.
          hugo-version: '0.164.0'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
