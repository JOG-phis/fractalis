# Currículo oficial de Física y Química (3º ESO) en Andalucía.
# Fuente: Orden de 30 de mayo de 2023 (ESO, Andalucía), Anexo II. BOJA nº 104, de 2 de junio de 2023.
# Texto extraído del BOJA; no editar salvo para corregir erratas de la extracción.
materia: Física y Química
curso: "3º ESO"
norma:
  nombre: Orden de 30 de mayo de 2023 (ESO, Andalucía), Anexo II
  boja: BOJA nº 104, de 2 de junio de 2023
  url: "https://www.juntadeandalucia.es/eboja/2023/104/BOJA23-104-00289-9727-01_00284752.pdf"
competencias:
- n: 1
  texto: Comprender y relacionar los motivos por los que ocurren los principales fenómenos fisicoquímicos del entorno, explicándolos en términos de las leyes y teorías científicas adecuadas, para resolver problemas con el fin de aplicarlas para mejorar la realidad cercana y la calidad de vida humana.
  descriptores:
  - CCL1
  - STEM1
  - STEM2
  - STEM4
  - CPSAA4
  criterios:
  - n: "1.1"
    texto: Identificar, comprender y explicar los fenómenos fisicoquímicos cotidianos más relevantes, a partir de los principios, teorías y leyes científicas adecuadas, expresándolos, de manera argumentada, utilizando diversidad de soportes y medios de comunicación.
    saberes:
    - FYQ.3.A.5
    - FYQ.3.B.1
    - FYQ.3.D.1
    - FYQ.3.D.3
    - FYQ.3.E.1
  - n: "1.2"
    texto: Resolver los problemas fisicoquímicos planteados utilizando las leyes y teorías científicas adecuadas, razonando los procedimientos utilizados para encontrar las soluciones y expresando adecuadamente los resultados.
    saberes:
    - FYQ.3.A.2
    - FYQ.3.A.4
    - FYQ.3.B.1
    - FYQ.3.B.2
    - FYQ.3.D.1
    - FYQ.3.D.2
    - FYQ.3.E.2
  - n: "1.3"
    texto: Reconocer y describir en el entorno inmediato situaciones problemáticas reales de índole científica y emprender iniciativas en las que la ciencia, y en particular la física y la química, pueden contribuir a su solución, analizando críticamente su impacto en la sociedad.
    saberes:
    - FYQ.3.A.1
    - FYQ.3.C.1
    - FYQ.3.C.2
    - FYQ.3.D.1
    - FYQ.3.D.2
    - FYQ.3.E.3
- n: 2
  texto: Expresar las observaciones realizadas por el alumnado en forma de preguntas, formulando hipótesis, para explicarlas y demostrando dichas hipótesis a través de la experimentación científica, la indagación y la búsqueda de evidencias, para desarrollar los razonamientos propios del pensamiento científico y mejorar las destrezas en el uso de las metodologías científicas.
  descriptores:
  - CCL1
  - CCL3
  - STEM1
  - STEM2
  - CD1
  - CPSAA4
  - CE1
  - CCEC3
  criterios:
  - n: "2.1"
    texto: Emplear las metodologías propias de la ciencia para identificar y describir fenómenos a partir de cuestiones a las que se pueda dar respuesta a través de la indagación, la deducción, el trabajo experimental y el razonamiento lógicomatemático, diferenciándolas de aquellas pseudocientíficas que no admiten comprobación experimental.
    saberes:
    - FYQ.3.A.2
    - FYQ.3.B.1
    - FYQ.3.B.2
    - FYQ.3.C.1
    - FYQ.3.C.2
    - FYQ.3.C.3
    - FYQ.3.D.1
    - FYQ.3.D.2
    - FYQ.3.D.3
    - FYQ.3.E.3
  - n: "2.2"
    texto: Seleccionar, de acuerdo con la naturaleza de las cuestiones que se traten, la mejor manera de comprobar o refutar las hipótesis formuladas, para diseñar estrategias de indagación y búsqueda de evidencias que permitan obtener conclusiones y repuestas ajustadas a la naturaleza de la pregunta formulada.
    saberes:
    - FYQ.3.A.2
    - FYQ.3.B.1
    - FYQ.3.C.1
    - FYQ.3.C.2
    - FYQ.3.D.1
    - FYQ.3.D.2
    - FYQ.3.E.2
    - FYQ.3.E.3
  - n: "2.3"
    texto: Aplicar las leyes y teorías científicas conocidas para formular cuestiones e hipótesis, de manera informada y coherente con el conocimiento científico existente y diseñar los procedimientos experimentales o deductivos necesarios para resolverlas o comprobarlas.
    saberes:
    - FYQ.3.A.1
    - FYQ.3.A.5
    - FYQ.3.B.1
    - FYQ.3.B.2
    - FYQ.3.D.1
    - FYQ.3.D.2
    - FYQ.3.D.3
    - FYQ.3.E.2
- n: 3
  texto: Manejar con soltura las reglas y normas básicas de la física y la química en lo referente al lenguaje de la IUPAC, al lenguaje matemático, al empleo de unidades de medida correctas, al uso seguro del laboratorio y a la interpretación y producción de datos e información en diferentes formatos y fuentes (textos, enunciados, tablas, gráficas, informes, manuales, diagramas, fórmulas, esquemas, modelos, símbolos, etc.), para reconocer el carácter universal y transversal del lenguaje científico y la necesidad de una comunicación fiable en investigación y ciencia entre diferentes países y culturas.
  descriptores:
  - STEM4
  - STEM5
  - CD3
  - CPSAA2
  - CC1
  - CCEC2
  - CCEC4
  criterios:
  - n: "3.1"
    texto: Emplear datos en diferentes formatos para interpretar y comunicar información relativa a un proceso fisicoquímico concreto, relacionando entre sí lo que cada uno de ellos contiene, y extrayendo en cada caso lo más relevante para la resolución de un problema.
    saberes:
    - FYQ.3.A.4
    - FYQ.3.B.1
    - FYQ.3.C.1
    - FYQ.3.C.2
    - FYQ.3.D.1
    - FYQ.3.D.2
  - n: "3.2"
    texto: Utilizar adecuadamente las reglas básicas de la física y la química, incluyendo el uso de unidades de medida, las herramientas matemáticas y las reglas de nomenclatura, consiguiendo una comunicación efectiva con toda la comunidad científica.
    saberes:
    - FYQ.3.A.4
    - FYQ.3.B.1
    - FYQ.3.B.2
    - FYQ.3.B.3
    - FYQ.3.D.1
    - FYQ.3.D.2
  - n: "3.3"
    texto: Poner en práctica las normas de uso de los espacios específicos de la ciencia, como el laboratorio de física y química, como medio de asegurar la salud propia y colectiva, la conservación sostenible del medioambiente y el cuidado de las instalaciones.
    saberes:
    - FYQ.3.A.2
    - FYQ.3.A.3
    - FYQ.3.B.1
    - FYQ.3.B.2
    - FYQ.3.C.1
    - FYQ.3.D.1
    - FYQ.3.D.2
    - FYQ.3.D.3
    - FYQ.3.E.2
