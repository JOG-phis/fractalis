bloques:
- id: A
  titulo: Las destrezas científicas básicas
  saberes:
  - codigo: FYQ.3.A.1
    texto: "Metodologías de la investigación científica: identificación y formulación de cuestiones, elaboración de hipótesis y comprobación experimental de las mismas."
  - codigo: FYQ.3.A.2
    texto: "Trabajo experimental y proyectos de investigación: estrategias en la resolución de problemas y en el desarrollo de las investigaciones mediante la indagación, la deducción, la búsqueda de evidencias y el razonamiento lógico-matemático, haciendo inferencias válidas de las observaciones y obteniendo conclusiones."
  - codigo: FYQ.3.A.3
    texto: "Diversos entornos y recursos de aprendizaje científico, como el laboratorio o los entornos virtuales: materiales, sustancias y herramientas tecnológicas, atendiendo a las normas de uso de cada espacio para asegurar la conservación de la salud propia y comunitaria, la seguridad en redes y el respeto hacia el medioambiente. Identificación e interpretación del etiquetado en productos químicos. Reciclaje y eliminación de residuos en el laboratorio."
  - codigo: FYQ.3.A.4
    texto: Uso del lenguaje científico, incluyendo el manejo adecuado de sistemas de unidades, utilizando preferentemente el Sistema Internacional de Unidades y la notación científica para expresar los resultados, y herramientas matemáticas, para conseguir una comunicación argumentada con diferentes entornos científicos y de aprendizaje.
  - codigo: FYQ.3.A.5
    texto: Interpretación y producción de información científica en diferentes formatos y a partir de diferentes medios para desarrollar un criterio propio basado en lo que el pensamiento científico aporta a la mejora de la sociedad para hacerla más justa, equitativa e igualitaria.
  - codigo: FYQ.3.A.6
    texto: Valoración de la cultura científica y del papel de científicos y científicas en los principales hitos históricos y actuales de la física y la química para el avance y la mejora de la sociedad. La Ciencia en Andalucía.
- id: B
  titulo: La materia
  saberes:
  - codigo: FYQ.3.B.1
    texto: Aplicación de los conocimientos sobre la estructura atómica de la materia para entender y explicar la formación de estructuras más complejas, de iones, la existencia de isótopos y sus propiedades, el desarrollo histórico del modelo atómico y la ordenación y clasificación de los elementos en la Tabla Periódica.
  - codigo: FYQ.3.B.2
    texto: "Principales compuestos químicos: su formación y sus propiedades físicas y químicas, valoración de sus aplicaciones. Masa atómica y masa molecular. Aproximación al concepto de mol. Elementos y compuestos de especial interés con aplicaciones industriales, tecnológicas y biométricas."
  - codigo: FYQ.3.B.3
    texto: Participación de un lenguaje científico común y universal a través de la formulación y nomenclatura de sustancias simples, iones monoatómicos y compuestos binarios mediante las reglas de nomenclatura de la IUPAC.
- id: C
  titulo: La energía
  saberes:
  - codigo: FYQ.3.C.1
    texto: Diseño y comprobación experimental de hipótesis, relacionadas con el uso doméstico e industrial de la energía en sus distintas formas y las transformaciones entre ellas.
  - codigo: FYQ.3.C.2
    texto: Elaboración fundamentada de hipótesis sobre el medioambiente y la sostenibilidad a partir de las diferencias entre fuentes de energía renovables y no renovables. Energías renovables en Andalucía.
  - codigo: FYQ.3.C.3
    texto: Consideración de la naturaleza eléctrica de la materia y explicación del fenómeno físico de la corriente eléctrica con base en la Ley de Ohm así como diseño y construcción de circuitos eléctricos en laboratorio o de forma virtual, y la obtención de energía eléctrica para desarrollar conciencia sobre la necesidad del ahorro energético y la conservación sostenible del medioambiente.
- id: D
  titulo: La interacción
  saberes:
  - codigo: FYQ.3.D.1
    texto: Tipos de magnitudes escalares y vectoriales. Concepto de posición, trayectoria y espacio recorrido. Velocidad media, velocidad instantánea y aceleración. Predicción de movimientos sencillos a partir de los conceptos de la cinemática posición, velocidad y aceleración, para formular hipótesis comprobables sobre valores futuros de estas magnitudes, y validación de dichas hipótesis a través del cálculo numérico, la interpretación de gráficas o el trabajo experimental.
  - codigo: FYQ.3.D.2
    texto: "Las fuerzas como agentes de cambio: relación de los efectos de las fuerzas, tanto en el estado de movimiento o de reposo de un cuerpo como produciendo deformaciones en los sistemas sobre los que actúan. Aplicación de las leyes de Newton, de la Ley de Hooke, observación de situaciones cotidianas o de laboratorio que permiten entender cómo se comportan e interaccionan entre sí los sistemas materiales ante la acción de las fuerzas y predecir los efectos de estas en situaciones cotidianas y de seguridad vial. Introducción a la Ley de la Gravitación Universal y a la Ley de Coulomb."
  - codigo: FYQ.3.D.3
    texto: "Fenómenos gravitatorios, eléctricos y magnéticos: experimentos sencillos que evidencian la relación con las fuerzas de la naturaleza, especialmente los experimentos de Oersted y Faraday."
- id: E
  titulo: El cambio
  saberes:
  - codigo: FYQ.3.E.1
    texto: Interpretación de las reacciones químicas a nivel macroscópico y microscópico, en términos del modelo atómicomolecular de la materia y de la teoría de colisiones, para explicar las relaciones de la química con el medioambiente, la tecnología y la sociedad.
  - codigo: FYQ.3.E.2
    texto: Aplicación de la ley de conservación de la masa y de la ley de las proporciones definidas, para utilizarlas mediante cálculos estequiométricos como evidencias experimentales que permitan validar el modelo atómico-molecular de la materia.
  - codigo: FYQ.3.E.3
    texto: Análisis de los factores que afectan a las reacciones químicas para predecir su evolución de forma cualitativa y entender su importancia en la resolución de problemas actuales por parte de la ciencia.
