bloques:
- id: A
  titulo: Las destrezas científicas básicas
  saberes:
  - codigo: FYQ.4.A.1
    texto: Diseño del trabajo experimental y emprendimiento de proyectos de investigación para la resolución de problemas mediante el uso de la experimentación y el tratamiento del error, la indagación, la deducción, la búsqueda de evidencias o el razonamiento lógico-matemático para hacer inferencias válidas sobre la base de las observaciones y sacar conclusiones pertinentes y generales que vayan más allá de las condiciones experimentales para aplicarlas a nuevos escenarios. La investigación científica. La medida y su error. Análisis de datos experimentales.
  - codigo: FYQ.4.A.2
    texto: Empleo de diversos entornos y recursos de aprendizaje científico, como el laboratorio o los entornos virtuales, utilizando de forma correcta los materiales, sustancias y herramientas tecnológicas y atendiendo a las normas de uso de cada espacio para asegurar la conservación de la salud propia y comunitaria, la seguridad en redes y el respeto sostenible por el medioambiente. Proyecto de investigación sencillo.
  - codigo: FYQ.4.A.3
    texto: Uso del lenguaje científico, incluyendo el manejo adecuado de sistemas de unidades, la determinación de la ecuación de dimensiones de una fórmula sencilla, y herramientas matemáticas básicas, para conseguir una comunicación argumentada con diferentes entornos científicos y de aprendizaje. Las magnitudes. Ecuaciones dimensionales. El informe científico. Expresión de resultados de forma rigurosa en diferentes formatos.
  - codigo: FYQ.4.A.4
    texto: Interpretación y producción de información científica en diferentes formatos y a partir de diferentes medios para desarrollar un criterio propio basado en lo que el pensamiento científico aporta a la mejora de la sociedad para hacerla más justa, equitativa e igualitaria. Utilización de herramientas tecnológicas en el entorno científico. Selección, comprensión e interpretación de la información relevante de un texto de divulgación científica.
  - codigo: FYQ.4.A.5
    texto: Valoración de la cultura científica y del papel de científicos y científicas en los principales hitos históricos y actuales de la física y la química para el avance y la mejora de la sociedad.
- id: B
  titulo: La materia
  saberes:
  - codigo: FYQ.4.B.1
    texto: Realización de problemas de variada naturaleza sobre las propiedades fisicoquímicas de los sistemas materiales más comunes, en función de la naturaleza del enlace químico y de las fuerzas intermoleculares, incluyendo disoluciones y sistemas gaseosos, para la resolución de problemas relacionados con situaciones cotidianas diversas.
  - codigo: FYQ.4.B.2
    texto: Reconocimiento de los principales modelos atómicos clásicos y cuánticos y la descripción de las partículas subatómicas de los constituyentes de los átomos estableciendo su relación con los avances de la física y de la química más relevantes de la historia reciente. Estructura electrónica de los átomos.
  - codigo: FYQ.4.B.3
    texto: Relación, a partir de su configuración electrónica, de la distribución de los elementos en la Tabla Periódica con sus propiedades fisicoquímicas más importantes, agrupándolos por familias, para encontrar generalidades.
  - codigo: FYQ.4.B.4
    texto: Valoración de la utilidad de los compuestos químicos a partir de sus propiedades en relación con cómo se combinan los átomos, a la naturaleza iónica, covalente o metálica del enlace químico y a las fuerzas intermoleculares, como forma de reconocer la importancia de la química en otros campos como la ingeniería, la biología o el deporte.
  - codigo: FYQ.4.B.5
    texto: Cuantificación de la cantidad de materia de sistemas de diferente naturaleza en los términos generales del lenguaje científico, aplicación de la constante del número de Avogadro y reconocimiento del mol como la unidad de la cantidad de materia en el Sistema Internacional de Unidades para manejar con soltura las diferentes formas de medida y expresión de la misma en el entorno científico.
  - codigo: FYQ.4.B.6
    texto: Utilización e interpretación adecuada de la formulación y nomenclatura de compuestos químicos inorgánicos ternarios mediante las reglas de la IUPAC para contribuir a un lenguaje científico común.
  - codigo: FYQ.4.B.7
    texto: Introducción a la formulación y nomenclatura de los compuestos orgánicos mediante las reglas de la IUPAC como base para reconocer y representar los hidrocarburos sencillos y los grupos funcionales de alcoholes, aldehídos, cetonas, ácidos carboxílicos, ésteres y aminas para entender la gran variedad de compuestos del entorno basados en el carbono, su importancia biológica, sus múltiples usos y sus aplicaciones de especial interés.
- id: C
  titulo: La energía
  saberes:
  - codigo: FYQ.4.C.1
    texto: Formulación y comprobación de hipótesis sobre las distintas formas de energía, y sus aplicaciones a partir de sus propiedades y del principio de conservación, como base para la experimentación y la resolución de problemas relacionados con la energía mecánica, con o sin fuerza de rozamiento, en situaciones cotidianas que les permita asumir el papel que esta juega en el avance de la investigación científica.
  - codigo: FYQ.4.C.2
    texto: Reconocimiento cualitativo y cuantitativo de los distintos procesos de transferencia de energía, de la velocidad a la que transcurren y de sus efectos en los cuerpos, especialmente los cambios de estado y la dilatación, en los que están implicados fuerzas o diferencias de temperatura, como base de la resolución de problemas cotidianos. La luz y el sonido como ondas que transfieren energía. Utilización de la energía del Sol como fuente de energía limpia y renovable.
  - codigo: FYQ.4.C.3
    texto: Reconocimiento cualitativo y cuantitativo de que el calor y el trabajo son dos formas de transferencia de energía para identificar los diversos contextos en que se producen y valorar su importancia en situaciones de la vida cotidiana.
  - codigo: FYQ.4.C.4
    texto: Aplicación del concepto de equilibrio térmico al cálculo del valor de la energía transferida entre cuerpos a distinta temperatura y al valor de la temperatura de equilibrio para resolver problemas sencillos en situaciones de la vida cotidiana.
  - codigo: FYQ.4.C.5
    texto: Estimación de valores de energía y consumos energéticos en situaciones cotidianas mediante la aplicación de conocimientos, la búsqueda de información contrastada, la experimentación y el razonamiento científico para debatir y comprender la importancia de la energía en la sociedad, su producción y su uso responsable; así como la importancia histórica y actual de las máquinas térmicas.
- id: D
  titulo: La interacción
  saberes:
  - codigo: FYQ.4.D.1
    texto: Predicción y comprobación, utilizando la experimentación y el razonamiento lógico-matemático, de las principales magnitudes, ecuaciones y gráficas que describen el movimiento de un cuerpo, tanto rectilíneo como circular, para relacionarlo con situaciones cotidianas y la mejora de la calidad de vida.
  - codigo: FYQ.4.D.2
    texto: Aplicación de las Leyes de Newton y reconocimiento de la fuerza como agente de cambios en los cuerpos, como principio fundamental de la Física que se aplica a otros campos como el diseño, el deporte o la ingeniería.
  - codigo: FYQ.4.D.3
    texto: Uso del álgebra vectorial básica para la realización gráfica y numérica de operaciones con fuerzas y su aplicación a la resolución de problemas relacionados con sistemas sometidos a conjuntos de fuerzas y valoración de su importancia en situaciones cotidianas.
  - codigo: FYQ.4.D.4
    texto: Aplicación de la Ley de Gravitación Universal en diferentes contextos, como la caída de los cuerpos y el movimiento orbital, para interpretar y explicar situaciones cotidianas.
  - codigo: FYQ.4.D.5
    texto: Identificación y manejo de las principales fuerzas del entorno cotidiano, como el peso, la normal, el rozamiento, la tensión o el empuje, y su uso en la explicación de fenómenos físicos en distintos escenarios.
  - codigo: FYQ.4.D.6
    texto: Valoración de los efectos de las fuerzas aplicadas sobre superficies que afectan a medios líquidos o gaseosos, especialmente del concepto de presión, para comprender las aplicaciones derivadas de sus efectos.
- id: E
  titulo: El cambio
  saberes:
  - codigo: FYQ.4.E.1
    texto: Utilización de la información contenida en una ecuación química ajustada y de las leyes más relevantes de las reacciones químicas para hacer con ellas predicciones cualitativas y cuantitativas por métodos experimentales y numéricos, y relacionarlo con los procesos fisicoquímicos de la industria, el medioambiente y la sociedad.
  - codigo: FYQ.4.E.2
    texto: Descripción cualitativa de reacciones químicas del entorno cotidiano, incluyendo las combustiones, las neutralizaciones y los procesos electroquímicos, comprobando experimentalmente algunos de sus parámetros, para hacer una valoración de sus implicaciones en la tecnología, la sociedad o el medioambiente y de su especial importancia económica y social en Andalucía (el hidrógeno verde, los combustibles fósiles, la metalurgia y electrólisis del cobre).
  - codigo: FYQ.4.E.3
    texto: Aplicación de la Teoría de Arrhenius al estudio de las propiedades de los ácidos y bases, los indicadores y la escala de pH para describir su comportamiento químico y sus aplicaciones en situaciones de la vida cotidiana.
  - codigo: FYQ.4.E.4
    texto: Relación de las variables termodinámicas y cinéticas en las reacciones químicas, aplicando modelos como la teoría de colisiones, para explicar el mecanismo de una reacción química, su velocidad y energía, a partir de la reordenación de los átomos, así como la ley de conservación de la masa y realizar predicciones aplicadas a los procesos cotidianos más importantes.
